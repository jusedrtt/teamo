<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para a Livia</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--bg:#000;--heart:#ff2a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:'VT323','Courier New',monospace;overflow:hidden}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center}
.screen.on{display:flex}
#s1 h1{font-weight:400;font-size:clamp(28px,6vw,48px);margin:0 0 24px;letter-spacing:2px}
#s1 input{background:#000;color:#fff;border:4px solid #fff;font:inherit;font-size:clamp(28px,6vw,44px);padding:8px 16px;width:min(420px,90vw);text-align:center;outline:none;text-transform:uppercase}
#s1 input:focus-visible{border-color:#ffe600}
.btn{margin-top:24px;background:#000;border:4px solid #fff;color:#fff;font:inherit;font-size:clamp(26px,5vw,38px);padding:6px 28px;cursor:pointer}
.btn:hover,.btn:focus-visible{color:#ffe600;border-color:#ffe600;outline:none}
#err{font-size:clamp(30px,7vw,60px);line-height:1.15;color:#fff;max-width:900px;min-height:4em}
#err b{color:var(--heart);font-weight:400}
#go{display:none}
/* galaxy */
#s2{background:radial-gradient(ellipse at 20% 30%,#4b1d7a55,transparent 55%),radial-gradient(ellipse at 80% 70%,#0e3a8a66,transparent 55%),radial-gradient(ellipse at 60% 15%,#a3246b44,transparent 50%),#05020f;padding:0;justify-content:flex-start;align-items:stretch}
canvas{position:absolute;inset:0;width:100%;height:100%}
#pair{position:absolute;top:6vh;left:0;height:30vh;display:flex;align-items:center;animation:cross 16s linear infinite;z-index:2}
#pair>div{animation:bob 3.2s ease-in-out infinite}
#trail{width:46vw;height:12vh;min-height:48px;display:flex;flex-direction:column;margin-right:-14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 70%);mask-image:linear-gradient(90deg,transparent,#000 70%);animation:wave .5s steps(2) infinite}
#trail i{flex:1;display:block}
#drawing{height:18vh;min-height:90px;display:block;margin-right:18vw;transform:scaleX(-1);image-rendering:pixelated}
#photo{height:26vh;min-height:130px;display:block;border:5px solid #fff;border-radius:6px;box-shadow:0 0 30px #ff6bd6aa}
.row{display:flex;align-items:center}
@keyframes cross{from{transform:translateX(-120vw)}to{transform:translateX(105vw)}}
@keyframes bob{50%{transform:translateY(14px)}}
@keyframes wave{50%{transform:translateY(5px)}}
#credits{position:absolute;left:0;right:0;bottom:0;height:100%;overflow:hidden;z-index:1;-webkit-mask-image:linear-gradient(to bottom,transparent 38%,#000 58%);mask-image:linear-gradient(to bottom,transparent 38%,#000 58%)}
#roll{position:absolute;left:0;right:0;top:100%;text-align:center;font-size:clamp(34px,7vw,64px);line-height:1.25;letter-spacing:2px;text-shadow:0 0 12px #000;animation:roll 40s linear infinite}
#roll p{margin:.15em 0}
#roll .gap{height:1.6em}
#roll .love{color:#ff5a8a}
@keyframes roll{to{transform:translateY(-100%) translateY(-100vh)}}
#replay{position:absolute;right:12px;bottom:12px;z-index:3;font-size:22px;padding:2px 12px;margin:0}
@media (prefers-reduced-motion:reduce){#pair{animation-duration:50s}#roll{animation-duration:90s}}
</style></head><body>

<section class="screen on" id="s1">
 <h1>QUAL É O SEU NOME?</h1>
 <input id="name" maxlength="30" autocomplete="off" aria-label="Seu nome" autofocus>
 <button class="btn" id="ok">OK</button>
</section>

<section class="screen" id="s1b">
 <div id="err" aria-live="polite"></div>
 <button class="btn" id="go">▶ CONTINUAR</button>
</section>

<script>
const $=id=>document.getElementById(id);
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on')};
function submit(){
 show('s1b');
 const msg='ERRADO LIVIA VOCE É O AMOR DA MINHA VIDA';
 const el=$('err');el.textContent='';let i=0;
 const t=setInterval(()=>{
  i++;el.innerHTML=msg.slice(0,i).replace('AMOR DA MINHA VIDA','<b>AMOR DA MINHA VIDA</b>');
  if(i>=msg.length){clearInterval(t);$('go').style.display='inline-block';$('go').focus()}
 },70);
}
$('ok').onclick=submit;
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
$('go').onclick=()=>{show('s2');start()};
$('replay').onclick=start;

const blocks=[
['LINDA','PERFEITA','MARAVILHOSA','INCRÍVEL','MAJESTOSA','CHEIROSA','FOFINHA','BEBEZINHA','A 8ª MARAVILHA DO MUNDO','DILICINHA','EU TE AMO','EU TE AMO','EU TE AMO'],
['BEAUTIFUL','PERFECT','WONDERFUL','INCREDIBLE','MAJESTIC','SMELLS AMAZING','GORGEOUS','ADORABLE','BABY GIRL','THE 8TH WONDER OF THE WORLD','SO SWEET','I LOVE YOU','I LOVE YOU','I LOVE YOU'],
['HERMOSA','PERFECTA','MARAVILLOSA','INCREÍBLE','MAJESTUOSA','HUELES DELICIOSO','PRECIOSA','ADORABLE','BEBITA','LA 8.ª MARAVILLA DEL MUNDO','DELICIOSITA','TE AMO','TE AMO','TE AMO']
];
function start(){
 const r=$('roll');r.style.animation='none';r.offsetHeight;
 r.innerHTML=blocks.map(b=>b.map(w=>`<p class="${w.includes('AMO')||w.includes('LOVE')?'love':''}">${w}</p>`).join('')).join('<div class="gap"></div>');
 r.style.animation='';
}
// stars
const c=$('sky'),x=c.getContext('2d');let S=[];
function size(){c.width=innerWidth;c.height=innerHeight;S=Array.from({length:140},()=>({x:Math.random()*c.width,y:Math.random()*c.height,z:Math.random()*2+.4,p:Math.random()*6}))}
addEventListener('resize',size);size();
(function f(t){x.clearRect(0,0,c.width,c.height);
 for(const s of S){s.x-=s.z*.15;if(s.x<0)s.x=c.width;x.globalAlpha=.5+.5*Math.sin(t/600+s.p);x.fillStyle='#fff';x.fillRect(s.x,s.y,s.z,s.z)}
 requestAnimationFrame(f)})(0);
</script>
